name: CI
permissions: {}
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, static analysis, and distribution
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'WordPress/ai-provider-for-openai' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - name: Run lint and static analysis
        run: composer lint
      - name: Verify Composer archive exclusions
        run: |
          git archive --format=tar HEAD > /tmp/ai-provider-composer.tar
          tar -tf /tmp/ai-provider-composer.tar > /tmp/ai-provider-composer-files.txt
          if grep -Eq '^(tests/|phpunit\.xml\.dist$)' /tmp/ai-provider-composer-files.txt; then
            echo 'Composer archive contains development test assets.' >&2
            exit 1
          fi
      - name: Verify WordPress.org package exclusions
        run: |
          wporg_stage="$(mktemp -d)"
          rsync -a --exclude-from=.distignore ./ "$wporg_stage/"
          test ! -e "$wporg_stage/tests"
          test ! -e "$wporg_stage/phpunit.xml.dist"
          test -e "$wporg_stage/plugin.php"
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'WordPress/ai-provider-for-openai' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        dependencies: [lowest, latest]
        include:
          - dependencies: lowest
            composer_options: --prefer-lowest
          - dependencies: latest
            composer_options: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Configure Composer platform
        run: composer config platform.php ${{ matrix.php }}
      - name: Install Composer dependencies
        run: composer update wordpress/php-ai-client --with-all-dependencies --no-interaction --no-progress --prefer-dist ${{ matrix.composer_options }}
      - name: Run PHPUnit
        run: composer test
