name: PHPUnit

on:
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'tests/**'

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (php-ai-client ${{ matrix.php-ai-client }})
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'WordPress/ai-provider-for-openai' || github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        php-ai-client: ['1.3.1', '1.4.0']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install dependencies
        run: composer update wordpress/php-ai-client --with=wordpress/php-ai-client:${{ matrix.php-ai-client }} --with-all-dependencies --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: composer test
